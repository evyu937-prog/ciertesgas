<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Multi-Página Pro</title>
<style>
    :root {
        --primary: #007bff;
        --success: #28a745;
        --danger: #dc3545;
    }
    
    * { box-sizing: border-box; }
    
    body {
        font-family: 'Segoe UI', sans-serif;
        max-width: 1200px;
        margin: 20px auto;
        padding: 15px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
    }
    
    .container {
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        overflow: hidden;
    }
    
    .tabs-header {
        display: flex;
        background: #f8f9fa;
        border-bottom: 2px solid #dee2e6;
        overflow-x: auto;
    }
    
    .tab-button {
        padding: 15px 25px;
        background: none;
        border: none;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        color: #6c757d;
        border-bottom: 3px solid transparent;
        white-space: nowrap;
        transition: all 0.3s;
    }
    
    .tab-button.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
        background: white;
    }
    
    .tab-button .close {
        margin-left: 10px;
        color: var(--danger);
        font-weight: bold;
        display: none;
    }
    
    .tab-button.active:hover .close {
        display: inline;
    }
    
    .btn-add {
        color: var(--success) !important;
        font-size: 20px !important;
    }
    
    .tab-content {
        display: none;
        padding: 25px;
        animation: fadeIn 0.3s;
    }
    
    .tab-content.active {
        display: block;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .controls {
        display: flex;
        gap: 10px;
        margin: 20px 0;
        flex-wrap: wrap;
    }
    
    button {
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.2s;
    }
    
    .btn-primary { background: var(--primary); color: white; }
    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    
    button:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.15); }
    
    textarea {
        width: 100%;
        height: 200px;
        padding: 15px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-family: monospace;
        font-size: 13px;
        resize: vertical;
    }
    
    .categoria-card {
        margin: 20px 0;
        padding: 20px;
        background: #f8f9fa;
        border-radius: 8px;
        border-left: 5px solid var(--primary);
    }
    
    .categoria-titulo {
        font-weight: bold;
        font-size: 18px;
        margin-bottom: 15px;
    }
    
    .valores-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 8px;
    }
    
    .valor-item {
        background: white;
        padding: 8px;
        border-radius: 4px;
        text-align: center;
        border: 1px solid #dee2e6;
    }
    
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 25px;
    }
    
    th, td {
        padding: 12px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }
    
    th {
        background: var(--primary);
        color: white;
    }
    
    .total-general {
        background: linear-gradient(135deg, var(--success), #20c997);
        color: white;
        padding: 25px;
        border-radius: 8px;
        text-align: center;
        margin-top: 30px;
        font-size: 24px;
        font-weight: bold;
    }
</style>
</head>
<body>
<div class="container">
    <!-- Pestañas -->
    <div class="tabs-header" id="tabsHeader">
        <button class="tab-button active" data-page="1" onclick="cambiarPestana(1)">
            Página 1 <span class="close" onclick="cerrarPestana(event, 1)">×</span>
        </button>
        <button class="tab-button" data-page="2" onclick="cambiarPestana(2)">
            Página 2 <span class="close" onclick="cerrarPestana(event, 2)">×</span>
        </button>
        <button class="tab-button btn-add" onclick="agregarPestana()">
            + Añadir
        </button>
    </div>
    
    <!-- Contenido de Pestañas -->
    <div id="tabsContainer">
        <div class="tab-content active" data-page="1">
            <textarea placeholder="Pega aquí los datos para Página 1...">RODAS

            <div class="controls">
                <button class="btn-primary" onclick="procesar(1)">🔍 Procesar Página 1</button>
                <button class="btn-success" onclick="exportarCSV(1)">📄 Exportar CSV 1</button>
                <button class="btn-danger" onclick="limpiarPagina(1)">🗑️ Limpiar Página 1</button>
            </div>
            
            <div class="resultados-section" id="resultados-1"></div>
        </div>
        
        <div class="tab-content" data-page="2">
            <textarea placeholder="Pega aquí los datos para Página 2 (otra persona)..."></textarea>
            
            <div class="controls">
                <button class="btn-primary" onclick="procesar(2)">🔍 Procesar Página 2</button>
                <button class="btn-success" onclick="exportarCSV(2)">📄 Exportar CSV 2</button>
                <button class="btn-danger" onclick="limpiarPagina(2)">🗑️ Limpiar Página 2</button>
            </div>
            
            <div class="resultados-section" id="resultados-2"></div>
        </div>
    </div>
</div>

<script>
let paginaActual = 1;
let contadorPestanas = 2;

function cambiarPestana(numero) {
    document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    const targetBtn = document.querySelector(`[data-page="${numero}"]`);
    const targetContent = document.querySelector(`.tab-content[data-page="${numero}"]`);
    
    if (targetBtn && targetContent) {
        targetBtn.classList.add('active');
        targetContent.classList.add('active');
        paginaActual = numero;
    }
}

function agregarPestana() {
    if (contadorPestanas >= 6) {
        alert('Máximo 6 páginas permitidas');
        return;
    }
    
    contadorPestanas++;
    const numero = contadorPestanas;
    
    const tabsHeader = document.getElementById('tabsHeader');
    const newTabBtn = document.createElement('button');
    newTabBtn.className = 'tab-button';
    newTabBtn.setAttribute('data-page', numero);
    newTabBtn.innerHTML = `Página ${numero} <span class="close" onclick="cerrarPestana(event, ${numero})">×</span>`;
    newTabBtn.onclick = () => cambiarPestana(numero);
    tabsHeader.insertBefore(newTabBtn, tabsHeader.lastElementChild);
    
    const tabsContainer = document.getElementById('tabsContainer');
    const newTabContent = document.createElement('div');
    newTabContent.className = 'tab-content';
    newTabContent.setAttribute('data-page', numero);
    newTabContent.innerHTML = `
        <textarea placeholder="Pega aquí los datos para Página ${numero}..."></textarea>
        <div class="controls">
            <button class="btn-primary" onclick="procesar(${numero})">🔍 Procesar Página ${numero}</button>
            <button class="btn-success" onclick="exportarCSV(${numero})">📄 Exportar CSV ${numero}</button>
            <button class="btn-danger" onclick="limpiarPagina(${numero})">🗑️ Limpiar Página ${numero}</button>
        </div>
        <div class="resultados-section" id="resultados-${numero}"></div>
    `;
    tabsContainer.appendChild(newTabContent);
    
    cambiarPestana(numero);
}

function cerrarPestana(event, numero) {
    event.stopPropagation();
    
    if (contadorPestanas <= 2) {
        alert('Debe haber al menos 2 páginas');
        return;
    }
    
    if (confirm(`¿Seguro que quieres cerrar la Página ${numero}? Se perderán todos los datos.`)) {
        document.querySelector(`[data-page="${numero}"].tab-button`).remove();
        document.querySelector(`.tab-content[data-page="${numero}"]`).remove();
        
        contadorPestanas--;
        
        if (paginaActual === numero) {
            cambiarPestana(1);
        }
    }
}

function limpiarPagina(numeroPagina) {
    if (!confirm(`🗑️ ¿Limpiar solo la Página ${numeroPagina}?\n\nSe eliminarán los datos y resultados de esta página solamente.`)) {
        return;
    }
    
    const container = document.querySelector(`.tab-content[data-page="${numeroPagina}"]`);
    const textarea = container.querySelector('textarea');
    const resultados = document.getElementById(`resultados-${numeroPagina}`);
    
    if (textarea) textarea.value = '';
    if (resultados) resultados.innerHTML = '';
    
    alert(`✅ Página ${numeroPagina} limpiada correctamente.`);
}

function procesar(numeroPagina) {
    const container = document.querySelector(`.tab-content[data-page="${numeroPagina}"]`);
    const textarea = container.querySelector('textarea');
    const resultadosDiv = document.getElementById(`resultados-${numeroPagina}`);
    
    const texto = textarea.value;
    const lineas = texto.split('\n');
    const categorias = {};
    let categoriaActual = null;
    
    lineas.forEach(linea => {
        linea = linea.trim();
        if (!linea) return;
        
        const valor = parseFloat(linea);
        if (isNaN(valor)) {
            categoriaActual = linea;
            categorias[categoriaActual] = [];
        } else {
            if (categoriaActual) categorias[categoriaActual].push(valor);
        }
    });
    
    let html = '<h2>📋 Detalle por Categoría</h2>';
    
    for (const [cat, valores] of Object.entries(categorias)) {
        if (valores.length === 0) continue;
        
        const totalCat = valores.reduce((a, b) => a + b, 0);
        
        html += `<div class="categoria-card">
            <div class="categoria-titulo">${cat} (${valores.length} valores)</div>
            <div class="valores-grid">
                ${valores.map(v => `<div class="valor-item">$${v.toFixed(2)}</div>`).join('')}
            </div>
            <div style="text-align:right;margin-top:10px;font-weight:bold;color:var(--primary);">
                Total: $${totalCat.toLocaleString('es-CO', {minimumFractionDigits: 2})}
            </div>
        </div>`;
    }
    
    html += '<h2>📊 Resumen Ejecutivo</h2><table><thead><tr><th>Categoría</th><th style="text-align:center;">Ítems</th><th style="text-align:right;">Total</th></tr></thead><tbody>';
    
    let totalGeneral = 0;
    for (const [cat, valores] of Object.entries(categorias)) {
        if (valores.length === 0) continue;
        const total = valores.reduce((a, b) => a + b, 0);
        totalGeneral += total;
        html += `<tr>
            <td><strong>${cat}</strong></td>
            <td style="text-align:center;">${valores.length}</td>
            <td style="text-align:right;">$${total.toLocaleString('es-CO', {minimumFractionDigits: 2})}</td>
        </tr>`;
    }
    
    html += '</tbody></table>';
    html += `<div class="total-general">
        TOTAL GENERAL: ${Object.values(categorias).reduce((a, b) => a + b.length, 0)} ítems | $${totalGeneral.toLocaleString('es-CO', {minimumFractionDigits: 2})}
    </div>`;
    
    resultadosDiv.innerHTML = html;
}

function exportarCSV(numeroPagina) {
    const container = document.querySelector(`.tab-content[data-page="${numeroPagina}"]`);
    const textarea = container.querySelector('textarea');
    
    const texto = textarea.value;
    const lineas = texto.split('\n');
    const categorias = {};
    let categoriaActual = null;
    
    lineas.forEach(linea => {
        linea = linea.trim();
        if (!linea) return;
        const valor = parseFloat(linea);
        if (isNaN(valor)) {
            categoriaActual = linea;
            categorias[categoriaActual] = [];
        } else {
            if (categoriaActual) categorias[categoriaActual].push(valor);
        }
    });
    
    let csv = 'Categoria,Items,Total\n';
    let totalGeneral = 0;
    
    for (const [cat, valores] of Object.entries(categorias)) {
        if (valores.length === 0) continue;
        const total = valores.reduce((a, b) => a + b, 0);
        totalGeneral += total;
        csv += `${cat},${valores.length},${total.toFixed(2)}\n`;
    }
    
    csv += `TOTAL GENERAL,${Object.values(categorias).reduce((a, b) => a + b.length, 0)},${totalGeneral.toFixed(2)}`;
    
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `pagina_${numeroPagina}_totales.csv`;
    link.click();
}
</script>
</body>
</html>
